name: Build workbooks
on:
  workflow_dispatch:
    inputs:
      level:
        description: "prek / grade1 / grade2 / all"
        default: "all"
      pages:
        description: "عدد الصفحات"
        default: "80"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: pip install reportlab arabic-reshaper python-bidi
      - run: python workbook.py ${{ inputs.level }} --pages ${{ inputs.pages }}
      - name: Commit PDFs
        run: |
          mkdir -p output
          mv workbook_*.pdf output/
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output
          git commit -m "build pdfs" || echo "no changes"
          git push
